<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flex! Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="title-bar">
    <span>Flex!</span>
</div>
<div class="main-wrapper">
    <div class="tap tap-title">
        <span>Projects</span>
    </div>

    <main class="main">
        <nav class="nav">
            <ul>
                <li class="main__nav-item">Education</li>
                <li class="main__nav-item">Food</li>
                <li class="main__nav-item">Meeting People</li>
                <li class="main__nav-item">Cinema</li>
            </ul>
        </nav>

        <div class="filter">
            <span class="filter__title">Browse By Client</span>
            <div class="filter__types">
                <span class="filter__name">Featured</span>
                <div class="filter__slash">/</div>
                <span class="filter__name filter__name--selected">Gallery</span>
                <div class="filter__slash">/</div>
                <span class="filter__name">List</span>
            </div>
        </div>

        <section class="projects">
            <div class="project">
                <div class="project__img-wrapper">
                    <img src="https://picsum.photos/seed/picsum1/400/300" class="project__img" alt="Project 1"/>
                </div>
                <span class="project__name">This is my best client!</span>
            </div>
            <div class="project">
                <div class="project__img-wrapper">
                    <img src="https://picsum.photos/seed/picsum2/400/300" class="project__img" alt="Project 2"/>
                </div>
                <span class="project__name">Creative Studio Design</span>
            </div>
            <div class="project">
                <div class="project__img-wrapper">
                    <img src="https://picsum.photos/seed/picsum3/400/300" class="project__img" alt="Project 3"/>
                </div>
                <span class="project__name">Modern Web App</span>
            </div>
            <div class="project">
                <div class="project__img-wrapper">
                    <img src="https://picsum.photos/seed/picsum4/400/300" class="project__img" alt="Project 4"/>
                </div>
                <span class="project__name">E-commerce Platform</span>
            </div>
            <div class="project">
                <div class="project__img-wrapper">
                    <img src="https://picsum.photos/seed/picsum5/400/300" class="project__img" alt="Project 5"/>
                </div>
                <span class="project__name">Brand Identity Concept</span>
            </div>
            <div class="project">
                <div class="project__img-wrapper">
                    <img src="https://picsum.photos/seed/picsum6/400/300" class="project__img" alt="Project 6"/>
                </div>
                <span class="project__name">UI/UX Revamp</span>
            </div>
        </section>
    </main>

    <div class="tap tap-title">
        <span>Projects</span>
    </div>
</div>
</body>
</html>
