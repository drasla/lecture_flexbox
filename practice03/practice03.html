<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Storage Dashboard (Flexbox)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="dashboard">
    <section class="storage-area">
        <div class="card hdd-card">
            <div class="hdd-icon">
                <div class="hdd-inner"></div>
            </div>
            <div class="hdd-footer">
                <span class="hdd-size">4TB</span>
                <div class="hdd-dots">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <div class="card hdd-card">
            <div class="hdd-icon">
                <div class="hdd-inner"></div>
            </div>
            <div class="hdd-footer">
                <span class="hdd-size">4TB</span>
                <div class="hdd-dots">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <div class="card hdd-card">
            <div class="hdd-icon">
                <div class="hdd-inner"></div>
            </div>
            <div class="hdd-footer">
                <span class="hdd-size">4TB</span>
                <div class="hdd-dots">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <div class="card hdd-card">
            <div class="hdd-icon">
                <div class="hdd-inner"></div>
            </div>
            <div class="hdd-footer">
                <span class="hdd-size">4TB</span>
                <div class="hdd-dots">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <div class="card space-card">
            <div class="space-item">
                <h3>Used (TB) / of Total</h3>
                <h2>5.66</h2>
            </div>
            <div class="space-item">
                <h3>Available (TB)</h3>
                <h2 class="text-accent">2.34</h2>
            </div>
        </div>

        <div class="card settings-card">
            <button class="settings-btn">Manage Space</button>
            <button class="settings-btn">Disc Settings</button>
            <button class="settings-btn">Create Backup</button>
        </div>
    </section>

    <section class="stats-list">
        <div class="stat-row bg-slate">
            <span class="stat-name">System Files</span>
            <span class="stat-size">0.50TB</span>
        </div>
        <div class="stat-row bg-yellow">
            <span class="stat-name">Media & Photos</span>
            <span class="stat-size">1.82TB</span>
        </div>
        <div class="stat-row bg-gray">
            <span class="stat-name">Applications</span>
            <span class="stat-size">1.20TB</span>
        </div>
        <div class="stat-row bg-red">
            <span class="stat-name">Documents</span>
            <span class="stat-size">2.14TB</span>
        </div>
        <div class="stat-row bg-dark">
            <span class="stat-name">Free Space</span>
            <span class="stat-size">2.34TB</span>
        </div>
    </section>
</div>
</body>
</html>
