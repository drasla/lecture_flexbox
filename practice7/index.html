<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Natural Flow Profile Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="app-container">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-cube brand-icon"></i>
            <h2>MyDash</h2>
        </div>

        <nav class="nav-menu">
            <a href="#" class="nav-item active">
                <i class="fa-regular fa-id-badge"></i>
                <span>Profile Info</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Account Security</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-regular fa-bell"></i>
                <span>Notifications</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-credit-card"></i>
                <span>Billing Details</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="header-text">
                <h2>Profile Information</h2>
                <p>Update your photo and personal details.</p>
            </div>
            <div class="user-shortcut">
                <i class="fa-solid fa-magnifying-glass"></i>
                <div class="user-avatar-small">A</div>
            </div>
        </header>

        <div class="content-wrapper">
            <form class="profile-form">

                <div class="avatar-section">
                    <div class="avatar-circle">
                        <span class="avatar-initial">A</span>
                    </div>
                    <div class="avatar-actions">
                        <button type="button" class="btn btn-primary">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Upload
                        </button>
                        <button type="button" class="btn btn-outline">
                            <i class="fa-solid fa-trash-can"></i> Remove
                        </button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" class="form-input" value="Alex">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" class="form-input" value="Smith">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Email Address</label>
                        <input type="email" class="form-input" value="alex.smith@example.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Phone Number</label>
                        <input type="tel" class="form-input" value="+1 234 567 890">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label class="custom-checkbox-wrapper">
                            <input type="checkbox" class="hidden-checkbox" checked>
                            <div class="checkbox-box">
                                <div class="checkmark-icon"></div>
                            </div>
                            <span class="checkbox-label">Receive updates and newsletters via email</span>
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-outline">Cancel</button>
                    <button type="button" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
